# The unitree_hg/LowCmd the G1 low-level example holds its start pose with,
# published on /lowcmd at 50 Hz by `ros2 topic pub` in launch/unitree_g1.launch.py.
# UnitreeHgLowLevel leaves the joints slack until a command arrives, so this is
# what keeps the robot standing while nothing else is driving it; a policy
# publishes faster than 50 Hz and takes the topic over.
#
# motor_cmd is indexed in LowCmd motor order, which is the order the joints are
# declared in urdf/unitree_g1/ros2_control.urdf.xacro: q is each joint's
# initial_value there and kp/kd are the gains its ros2_control block uses, so the
# robot stands the same way in both modes. Slots 29-34 do not exist on the 29-DoF
# G1 and are left at mode 0.
#
# crc is inert here -- the plugin never checks it, while the real robot's SDK
# computes it itself -- so this message is for the simulation only.
mode_pr: 0
mode_machine: 0
