# AB (motor-space) counterpart of hold_start_message.yaml (see that file for the
# full explanation of the scheme, and its KNOWN ISSUE note: at mode_pr: 1 the
# robot has been observed to topple where the mode_pr: 0 version stands fine).
#
# Slots 4/5 and 10/11 (left/right ankle pitch/roll in mode_pr: 0) drive
# left/right_rod{B,A}_motor_joint instead (pitch pairs with B, roll with A,
# per Unitree's own index table - and per motor_joints in
# urdf/unitree_g1/unitree_g1.urdf.xacro's UnitreeHgLowLevel plugin block,
# which lists rodB before rodA for both legs). Their q is left/right_rodA/B
# _motor_joint's own initial_position in ros2_control.urdf.xacro (0.275878
# for A, -0.280022 for B) - the crank angle that closes the parallel-ankle
# loop at ankle_pitch/roll's own initial pose (-0.2/0.0), not that pose
# itself. Solved via forward-kinematics root-find, not hand-tuned - see the
# comment above those initial_position values.
# kp/kd are 100.0/4.0, not the ankle's own 200/2 and not the earlier
# 20.0/0.5 placeholder either. Two real bugs were behind the instability,
# neither of them "wrong gain":
#  1. left/right_rod{A,B}_loop <connect> equality constraints (see
#     urdf/unitree_g1/unitree_g1.urdf.xacro) had solref "0.001 1" - a
#     timeconst equal to the sim's own 1kHz/1ms timestep, essentially zero
#     numerical margin, so any crank PD feedback on top resonated into
#     divergence within ~1s under real ankle load. Raising the *timeconst*
#     alone (tried 0.01) was reverted: stiffness scales as 1/timeconst^2, so
#     that was a ~100x stiffness loss, not 10x, and let the ankle visibly
#     sag under the robot's own weight. Raising the *damping ratio* instead
#     (1 -> 3, same 0.001 timeconst) fixes the resonance with far less
#     stiffness loss.
#  2. motor_joint's effort limit was a 20 N*m placeholder; Unitree's own
#     g1_29dof_rev_1_0.urdf rates the ankle_pitch/roll_joint output at 35
#     N*m, which converts to ~33 N*m of required crank torque through this
#     linkage's Jacobian - 20 N*m was saturating well before that, and a
#     torque-clamped PD behaves like a relay near saturation. Raised to 35.
# 100/4 was then chosen from an offline load(172N/343N)+disturbance sweep at
# the corrected solref/effort as a gain with stability margin to spare;
# reproduced and confirmed offline, not hand-tuned against the real sim.
