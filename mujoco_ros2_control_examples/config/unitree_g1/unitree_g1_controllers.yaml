controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 1000  # Hz  (stiff PD hold: run fast so the finite-difference damping is clean)

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    pelvis_imu_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    pelvis_pose_broadcaster:
      type: pose_broadcaster/PoseBroadcaster

    left_leg_position_controller:
      type: position_controllers/JointGroupPositionController
    right_leg_position_controller:
      type: position_controllers/JointGroupPositionController
    waist_position_controller:
      type: position_controllers/JointGroupPositionController
    left_arm_position_controller:
      type: position_controllers/JointGroupPositionController
    right_arm_position_controller:
      type: position_controllers/JointGroupPositionController

left_leg_position_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint

right_leg_position_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint

waist_position_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - waist_yaw_joint
      - waist_roll_joint
      - waist_pitch_joint

left_arm_position_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint

right_arm_position_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint

pelvis_imu_broadcaster:
  ros__parameters:
    use_sim_time: true
    sensor_name: "imu_in_pelvis"
    frame_id: "imu_in_pelvis"

pelvis_pose_broadcaster:
  ros__parameters:
    use_sim_time: true
    pose_name: "pelvis_pose"
    frame_id: "world"
    tf:
      enable: true
      child_frame_id: "pelvis"

d435:
  ros__parameters:
    frequency: 90.0
    width: 848
    height: 480
    fovx: 89.9
    fovy: 58.9

lidar_head:
  ros__parameters:
    output: cloud
    frequency: 10.0
    range_min: 0.1
    range_max: 40.0
    horizontal_min_angle: -3.14159
    horizontal_max_angle:  3.14159
    horizontal_samples: 720
    vertical_samples: 64
    vertical_min_angle: -0.907571
    vertical_max_angle:  0.122173
    noise_stddev: 0.0
    exclude_parent_body: true
    depth_threshold: 0.02

# UnitreeHgLowLevel, declared in the description as
# <mujoco_ros2_plugin name="unitree_g1_low_level"> when low_level:=true. The
# IMU site is part of the robot and stays in the xacro; what is tuned per run
# lives here. Neither the joint list nor mode_machine is set at all: this is
# the 29-DOF G1, which is UnitreeHgLowLevel's own default (mode_machine == 2),
# picking its built-in joint order along with it.
unitree_g1_low_level:
  ros__parameters:
    # LowState publish rate in simulated Hz. The PD loop itself runs at the
    # physics rate regardless -- this only paces the topic.
    rate: 500.0
    command_topic: /lowcmd
    state_topic: /lowstate
    # Per-joint torque clamp, in the order the joints are declared. Left out
    # here, which means unclamped: a single value applies to every joint, and
    # nothing in MuJoCo limits qfrc_applied on its own.
    # effort_limits: [88.0]

    # Gamepad -> LowState::wireless_remote. Indices are into sensor_msgs/Joy,
    # and -1 (the default) packs a channel as zero, so this is only needed for a
    # policy that steers from the remote. The values below are an Xbox-layout
    # pad as the joy node reports it.
    joy_topic: /joy
    # joy:
    #   axis_lx: 0
    #   axis_ly: 1
    #   axis_rx: 3
    #   axis_ry: 4
    #   axis_l2: 2
    #   axis_lx_scale: -1.0   # joy is left-positive, the remote right-positive
    #   axis_rx_scale: -1.0
    #   # Joy button index -> bit in the 16-bit Unitree key mask:
    #   #   0 R1     1 L1      2 start  3 select
    #   #   4 R2     5 L2      6 F1     7 F2
    #   #   8 A      9 B      10 X     11 Y
    #   #  12 up    13 right  14 down  15 left
    #   button_joy_indices: [0, 1, 2, 3]
    #   button_bits:        [8, 9, 10, 11]
