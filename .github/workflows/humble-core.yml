name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: ros:humble
    env:
      ROS_DISTRO: humble
      DEBIAN_FRONTEND: noninteractive
      DISABLE_OPENGL: "0"
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe

    steps:
      # actions/checkout shells out to git-lfs to fetch the mesh objects, and
      # the ros:humble image ships git without it. This has to run before the
      # checkout, or the working tree ends up holding pointer files.
      - name: Install git-lfs
        run: |
          apt-get update
          apt-get install -y git-lfs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      # Only the deps rosdep cannot resolve: the MuJoCo simulate GUI build
      # headers (X11/Wayland/cmake-modules). Everything else (incl. urdfdom_py
      # and scipy) is declared in package.xml and handled by rosdep.
      - name: Install non-rosdep system dependencies
        run: |
          apt-get update
          apt-get install -y \
            libegl-dev \
            libx11-dev \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            extra-cmake-modules

      - name: Install Mesa software rendering (EGL/llvmpipe)
        run: |
          apt-get install -y \
            libegl1 \
            libglvnd0 \
            libopengl0 \
            libgl1-mesa-dri \
            libglx-mesa0 \
            mesa-utils \
            mesa-utils-extra

      # Diagnostic only, never a gate. eglinfo ships in mesa-utils-extra and can
      # still be missing or unhappy inside a container, so a non-zero exit here
      # says nothing reliable about whether MuJoCo can get a context. What
      # actually proves the job ran with GL is the skipped-test guard below.
      - name: Verify EGL software context
        run: |
          eglinfo -B || eglinfo || true

      - name: Set up workspace
        run: |
          mkdir -p /ros2_ws/src
          cp -r mujoco_ros2_control /ros2_ws/src/

      - name: Resolve rosdep dependencies
        working-directory: /ros2_ws
        run: |
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro $ROS_DISTRO -y

      - name: Build
        working-directory: /ros2_ws
        shell: bash
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          colcon build --packages-select mujoco_ros2_control

      - name: Test
        working-directory: /ros2_ws
        shell: bash
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          source install/setup.bash
          colcon test --packages-select mujoco_ros2_control --event-handlers console_direct+
          colcon test-result --test-result-base build/mujoco_ros2_control/test_results --verbose

      # These jobs deliberately run with OpenGL on (DISABLE_OPENGL=0), so a GL
      # test that reports "skipped" means the environment quietly lost EGL and
      # the run proved less than it claims. Treat that as a failure.
      #
      # `if: always()` means this also runs when an earlier step failed, so it
      # must cope with a workspace that was never created. No `working-directory`
      # for the same reason: pointing one at a missing /ros2_ws makes the runner
      # fail the step with a chdir error that buries the real failure.
      - name: Fail if any test was skipped for lack of OpenGL
        if: always()
        run: |
          results=/ros2_ws/build/*/test_results
          if ! ls -d $results >/dev/null 2>&1; then
            echo "No test results to check - the run did not get that far."
            exit 0
          fi
          if grep -rl "OpenGL disabled" $results 2>/dev/null | grep -q .; then
            echo "::error::GL tests were skipped, but this job runs with OpenGL enabled"
            grep -rn "OpenGL disabled" $results || true
            exit 1
          fi
          echo "No GL test was skipped."
