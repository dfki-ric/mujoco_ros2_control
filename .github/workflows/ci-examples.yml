name: CI Examples

on:
  push:
  pull_request:

jobs:
  build-and-test-examples:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy
    env:
      ROS_DISTRO: jazzy
      DEBIAN_FRONTEND: noninteractive
      DISABLE_OPENGL: "0"
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe

    steps:
      # actions/checkout shells out to git-lfs to fetch the mesh objects, and
      # the ros:jazzy image ships git without it. This has to run before the
      # checkout, or the working tree ends up holding pointer files.
      - name: Install git-lfs
        run: |
          apt-get update
          apt-get install -y git-lfs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install non-rosdep system dependencies
        run: |
          apt-get update
          apt-get install -y \
            git \
            libegl-dev \
            libx11-dev \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            extra-cmake-modules

      - name: Install Mesa software rendering (EGL/llvmpipe)
        run: |
          apt-get install -y \
            libegl1 \
            libglvnd0 \
            libopengl0 \
            libgl1-mesa-dri \
            libglx-mesa0 \
            mesa-utils

      # A real gate, not a smoke signal: if EGL cannot hand out a context then
      # this job is not running with GL, and the camera/LiDAR tests below would
      # fail with a confusing rendering error instead of failing here with an
      # obvious one. `-B` is the brief form; older eglinfo builds lack it, so
      # fall back to the full output, but do not swallow a genuine failure.
      - name: Verify EGL software context
        run: |
          eglinfo -B || eglinfo

      - name: Set up workspace
        run: |
          mkdir -p /ros2_ws/src
          cp -r mujoco_ros2_control /ros2_ws/src/
          cp -r mujoco_ros2_control_examples /ros2_ws/src/

          git clone -b jazzy https://github.com/frankarobotics/franka_description.git /ros2_ws/src/franka_description

      - name: Resolve rosdep dependencies
        working-directory: /ros2_ws
        run: |
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro $ROS_DISTRO -y

      - name: Build
        working-directory: /ros2_ws
        shell: bash
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          colcon build --packages-up-to mujoco_ros2_control_examples

      - name: Test Examples
        working-directory: /ros2_ws
        shell: bash
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          source install/setup.bash
          colcon test --packages-select mujoco_ros2_control_examples --event-handlers console_direct+
          colcon test-result --test-result-base build/mujoco_ros2_control_examples/test_results --verbose

      # These jobs deliberately run with OpenGL on (DISABLE_OPENGL=0), so a GL
      # test that reports "skipped" means the environment quietly lost EGL and
      # the run proved less than it claims. Treat that as a failure.
      - name: Fail if any test was skipped for lack of OpenGL
        if: always()
        working-directory: /ros2_ws
        run: |
          if grep -rl "OpenGL disabled" build/*/test_results/ 2>/dev/null | grep -q .; then
            echo "::error::GL tests were skipped, but this job runs with OpenGL enabled"
            grep -rn "OpenGL disabled" build/*/test_results/ || true
            exit 1
          fi
          echo "No GL test was skipped."
