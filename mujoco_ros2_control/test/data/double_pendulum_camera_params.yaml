# Site camera for the RealSense D435i. The node name is the site name with the
# prefix stripped: mjCamOpt_d435 / mjCamDepth_d435 -> "d435", so this block is
# keyed "d435" and topics are /d435/color/... and /d435/depth/... .
# Color is rendered from camera_color_optical_frame and depth from
# camera_depth_optical_frame (two render passes, true parallax).
d435:
  ros__parameters:
    enabled: true
    frequency: 30.0
    width: 640
    height: 480
    fovx: 87.0          # D435 depth horizontal FOV [deg]
    fovy: 58.0          # D435 depth vertical FOV [deg]
    color_image: true
    depth_image: true
    point_cloud: true

# Reached through <mujoco_ros2_plugin name="declared_camera"> on an unprefixed
# site sharing the d435's colour optical frame. Small and slow on purpose: this
# exercises the plugin path, not the renderer, which the d435 above covers.
declared_camera:
  ros__parameters:
    frequency: 10.0
    width: 320
    height: 240
    fovx: 87.0
    fovy: 58.0
    color_image: true
    depth_image: true
    point_cloud: true
