mujoco_ros2_control:
  robot_description: {
    type: string,
    default_value: "",
    read_only: true,
    description: "URDF Model from the robot"
  }

  robot_model_path: {
    type: string,
    default_value: "",
    read_only: true,
    description: "Mujoco Model from the robot"
  }

  show_gui: {
    type: bool,
    default_value: true,
    read_only: true,
    description: "Show the MuJoCo Simulation in a window"
  }

  simulation_frequency: {
    type: double,
    default_value: 1000.0,
    read_only: true,
    description: "Frequency of the Simulation",
    validation: {
      gt_eq: [ 25.0 ]
    }
  }

  clock_publisher_frequency: {
    type: double,
    default_value: 0.0,
    read_only: true,
    description: "Publish frequency of the Clock (use simulation_frequency when value is 0",
    validation: {
      gt_eq: [ 0.0 ]
    }
  }

  real_time_factor: {
    type: double,
    default_value: 1.0,
    description: "Real Time Factor of the Simulation",
    validation: {
      gt: [ 0.0 ]
    }
  }

  synchronous_mode: {
    type: bool,
    default_value: false,
    read_only: true,
    description: "Advance physics only through the mujoco_step_simulation service"
  }

  max_step_batch: {
    type: int,
    default_value: 10000,
    read_only: true,
    description: "Maximum number of physics steps accepted by one synchronous step request",
    validation: {
      gt: [0]
    }
  }

  mujoco_plugin_directories: {
    type: string_array,
    default_value: [],
    read_only: true,
    description: "Directories scanned for MuJoCo engine plugin libraries before the model is compiled. Every shared library in each directory is loaded. When left empty the package's own lib/mujoco_plugin directory is scanned, which provides the plugins shipped with MuJoCo (mujoco.sensor.touch_grid, mujoco.elasticity.cable, mujoco.pid and the mujoco.sdf.* set)."
  }

  mujoco_plugin_libraries: {
    type: string_array,
    default_value: [],
    read_only: true,
    description: "Explicit paths to MuJoCo engine plugin libraries, loaded after the directory scan. Startup fails if one of these paths does not exist."
  }
